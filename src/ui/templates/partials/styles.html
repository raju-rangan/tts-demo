  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    /* Driver.js Dark Theme Popovers */
    .driver-popover.driverjs-theme {
      background-color: #18181b;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
      border-radius: 1rem;
      padding: 16px 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      max-width: 360px;
    }
    .driver-popover.driverjs-theme .driver-popover-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .driver-popover.driverjs-theme .driver-popover-description {
      font-family: 'DM Sans', sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      color: #a1a1aa;
      margin-bottom: 12px;
    }
    .driver-popover.driverjs-theme .driver-popover-progress-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #71717a;
    }
    .driver-popover.driverjs-theme .driver-popover-close-btn {
      color: #71717a;
      font-size: 18px;
      top: 10px;
      right: 12px;
      transition: color 0.15s ease;
    }
    .driver-popover.driverjs-theme .driver-popover-close-btn:hover {
      color: #f43f5e;
    }
    .driver-popover.driverjs-theme button {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: 0.5rem;
      padding: 6px 12px;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .driver-popover.driverjs-theme .driver-popover-prev-btn {
      background-color: #27272a;
      color: #d4d4d8;
      border: 1px solid #3f3f46;
    }
    .driver-popover.driverjs-theme .driver-popover-prev-btn:hover {
      background-color: #3f3f46;
      color: #ffffff;
    }
    .driver-popover.driverjs-theme .driver-popover-next-btn {
      background: linear-gradient(to right, #10b981, #14b8a6);
      color: #09090b;
      border: none;
      font-weight: 700;
      text-shadow: none;
    }
    .driver-popover.driverjs-theme .driver-popover-next-btn:hover {
      background: linear-gradient(to right, #059669, #0d9488);
      color: #000000;
    }
    .driver-popover.driverjs-theme .driver-popover-arrow-side-top {
      border-bottom-color: #18181b;
    }
    .driver-popover.driverjs-theme .driver-popover-arrow-side-bottom {
      border-top-color: #18181b;
    }
    .driver-popover.driverjs-theme .driver-popover-arrow-side-left {
      border-right-color: #18181b;
    }
    .driver-popover.driverjs-theme .driver-popover-arrow-side-right {
      border-left-color: #18181b;
    }
  </style>
</head>
