[project]
name = "tts-demo"
version = "0.1.0"
description = "Knowledge Article to Human-Like Speech & Multimodal LLM-as-a-Judge Platform"
readme = "PRD.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "pydub>=0.25.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-firestore>=2.14.0",
    "lameenc>=1.8.4",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "google-auth>=2.28.0",
    "jinja2>=3.1.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
